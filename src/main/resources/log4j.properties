# Root logger option
log4j.rootLogger=INFO, stdout

# Direct log messages to stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Reduce noise from Hadoop/Hops components
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.hadoop.hdfs=INFO
log4j.logger.io.hops=INFO
log4j.logger.org.apache.hadoop.security=WARN
log4j.logger.org.apache.hadoop.util=WARN
log4j.logger.BlockStateChange=WARN
log4j.logger.org.apache.hadoop.hdfs.StateChange=WARN
log4j.logger.org.mortbay=WARN
log4j.logger.org.eclipse.jetty=WARN

# Keep Main class logs at INFO level
log4j.logger.org.hops.Main=INFO